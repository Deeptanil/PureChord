name: Build Signed Release APK

on:
  push:
    branches:
      - custom-sponsorblock
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Release tag suffix'
        required: false
        default: '-sb'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed Release & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configure Keystore & App Secrets
        run: |
          # Write optional service credentials
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

          # Decode signing keystore if available, otherwise generate an ephemeral fallback keystore
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
            {
              echo "storeFile=bitchord-release.jks"
              echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            } > keystore.properties
            echo "Release keystore decoded successfully."
          else
            echo "::warning::KEYSTORE_BASE64 secret is not configured. Generating ephemeral test signing keystore."
            keytool -genkeypair -v -keystore bitchord-release.jks -alias purechord -keyalg RSA -keysize 2048 -validity 10000 -storepass purechordtest -keypass purechordtest -dname "CN=PureChord Test, O=PureChord, C=US"
            {
              echo "storeFile=bitchord-release.jks"
              echo "storePassword=purechordtest"
              echo "keyAlias=purechord"
              echo "keyPassword=purechordtest"
            } > keystore.properties
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Resolve Release Version & Tag
        id: versioning
        run: |
          # Extract upstream versionName from root build.gradle.kts
          VERSION_NAME=$(grep 'extra\["bitchordVersionName"\]' build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0.0"
          fi
          
          SUFFIX="${{ github.event.inputs.tag_suffix || '-sb' }}"
          BASE_TAG="v${VERSION_NAME}${SUFFIX}"
          FINAL_TAG="$BASE_TAG"

          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "release_tag=${FINAL_TAG}" >> $GITHUB_OUTPUT
          echo "Resolved Release Tag: ${FINAL_TAG}"

      - name: Build Production Release APKs
        run: |
          # Build phone prod release APK directly without WearOS companion or TV module
          ./gradlew :app:assembleProdRelease -Pbitchord.bundleWear=false --stacktrace

      - name: Collect & Package Release APKs
        id: collect_apks
        run: |
          mkdir -p release-artifacts
          TAG="${{ steps.versioning.outputs.release_tag }}"

          # Copy signed universal phone APK
          UNIVERSAL_APK=$(find app/build/outputs/apk/prod/release -name "*universal*release*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -n "$UNIVERSAL_APK" ]; then
            DEST="release-artifacts/PureChord-${TAG}.apk"
            cp "$UNIVERSAL_APK" "$DEST"
            echo "Collected universal phone APK: $DEST"
          fi

          # Copy lighter signed arm64-v8a phone APK
          ARM64_APK=$(find app/build/outputs/apk/prod/release -name "*arm64-v8a*release*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -n "$ARM64_APK" ]; then
            DEST_ARM64="release-artifacts/PureChord-${TAG}-arm64-v8a.apk"
            cp "$ARM64_APK" "$DEST_ARM64"
            echo "Collected arm64-v8a phone APK: $DEST_ARM64"
          fi

          if [ -z "$UNIVERSAL_APK" ] && [ -z "$ARM64_APK" ]; then
            echo "::error::No signed release APKs found in app/build/outputs/apk/prod/release"
            ls -la app/build/outputs/apk/prod/release || true
            exit 1
          fi

          echo "Generated artifacts in release-artifacts/:"
          ls -lh release-artifacts/

      - name: Upload Build Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: purechord-release-${{ steps.versioning.outputs.release_tag }}
          path: release-artifacts/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.release_tag }}
          name: PureChord ${{ steps.versioning.outputs.release_tag }}
          body: |
            ### PureChord Release (`${{ steps.versioning.outputs.release_tag }}`)

            Automated signed release build synchronized with upstream BitChord and enhanced with custom SponsorBlock functionality.

            #### Features in this Release:
            - **Zero-Clutter SponsorBlock Integration:** Seamlessly merged into the existing **"Skip silence & non-music"** toggle in playback settings. No extra settings menus or UI clutter.
            - **Musical Silence DSP Protection:** Elevated silence gap detection to 3.5s with a 400-amplitude floor to protect musical rests, beat pauses (e.g. Adele's *Skyfall*), and instrument decays while continuing to cut non-musical dead air.
            - **Smart Seek & Replay Logic:**
              - **Song Restart:** Seeking to the beginning (< 1.0s) immediately skips starting intros straight to the music.
              - **Deliberate Segment Scrub:** Scrubbing directly into a skipped segment whitelists it, allowing you to listen to dialogues, intros, or sponsor messages without getting kicked out.
              - **Chained Segments:** Consecutive or adjacent segments are cleanly skipped in sequence without false whitelisting.
            - **Podcasts & Video Streams Support:** Extended SponsorBlock support to music tracks, podcasts, and video playback.
            - **Upstream Sync:** Built on top of the latest upstream BitChord source.

            #### Release Assets:
            - `PureChord-${{ steps.versioning.outputs.release_tag }}.apk`: Universal APK (all architectures)
            - `PureChord-${{ steps.versioning.outputs.release_tag }}-arm64-v8a.apk`: Lighter arm64-v8a APK for modern Android phones

            **Full Changelog**: https://github.com/Deeptanil/PureChord/commits/${{ steps.versioning.outputs.release_tag }}
          draft: false
          prerelease: false
          files: release-artifacts/*.apk
          generate_release_notes: true
