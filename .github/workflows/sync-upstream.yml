name: Sync Upstream

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream repository (owner/repo)'
        required: true
        default: 'kushagrasinghx/BitChord'
      upstream_branch:
        description: 'Upstream branch to sync'
        required: true
        default: 'main'
      feature_branch:
        description: 'Custom feature branch to merge updates into'
        required: true
        default: 'custom-sponsorblock'

permissions:
  contents: write

jobs:
  sync:
    name: Sync Upstream & Merge Changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          # Use GH_PAT if configured so that downstream push events trigger build-release
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch Upstream Changes
        run: |
          UPSTREAM_REPO="${{ github.event.inputs.upstream_repo || 'kushagrasinghx/BitChord' }}"
          echo "Adding upstream remote: https://github.com/${UPSTREAM_REPO}.git"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream --tags
          git fetch upstream "${{ github.event.inputs.upstream_branch || 'main' }}"

      - name: Fast-forward Main Branch to Upstream
        run: |
          UPSTREAM_BRANCH="${{ github.event.inputs.upstream_branch || 'main' }}"
          echo "Checking out local main branch..."
          git checkout main
          echo "Fast-forwarding main to upstream/${UPSTREAM_BRANCH}..."
          git merge --ff-only "upstream/${UPSTREAM_BRANCH}" || {
            echo "Fast-forward failed, hard-resetting main to match upstream/${UPSTREAM_BRANCH}..."
            git reset --hard "upstream/${UPSTREAM_BRANCH}"
          }
          echo "Pushing updated main branch to fork..."
          git push origin main --tags

      - name: Merge Upstream Updates into Custom Branch
        run: |
          FEATURE_BRANCH="${{ github.event.inputs.feature_branch || 'custom-sponsorblock' }}"
          echo "Checking out feature branch: ${FEATURE_BRANCH}..."
          git checkout "${FEATURE_BRANCH}"

          echo "Merging main into ${FEATURE_BRANCH}..."
          if ! git merge main -m "chore(sync): merge upstream updates from main into ${FEATURE_BRANCH}" --no-edit; then
            echo "::error::Merge conflict encountered when merging main into ${FEATURE_BRANCH}!"
            
            echo "Conflicted files:"
            git diff --name-only --diff-filter=U | tee conflicted_files.txt

            echo "### ⚠️ Merge Conflict Detected" >> $GITHUB_STEP_SUMMARY
            echo "An automated merge conflict occurred while merging upstream updates into \`${FEATURE_BRANCH}\`." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Conflicted files:**" >> $GITHUB_STEP_SUMMARY
            while IFS= read -r file; do
              echo "- \`$file\`" >> $GITHUB_STEP_SUMMARY
            done < conflicted_files.txt

            git merge --abort
            exit 1
          fi

          echo "Pushing merged changes to ${FEATURE_BRANCH}..."
          git push origin "${FEATURE_BRANCH}"

      - name: Summary
        run: |
          echo "### ✅ Upstream Sync Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "Successfully pulled the latest upstream changes into \`main\` and merged them into \`${{ github.event.inputs.feature_branch || 'custom-sponsorblock' }}\`." >> $GITHUB_STEP_SUMMARY
